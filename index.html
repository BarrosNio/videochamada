<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Premium Video Connect</title>
    <!-- Tailwind for basic utilities only -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <style>
        :root {
            --glow-color: rgba(99, 102, 241, 0.5);
            --bg-dark: #07070a;
            --bg-lighter: #101018;
            --font-main: 'Outfit', sans-serif;
            --safe-bottom: env(safe-area-inset-bottom, 15px);
        }

        /* 
        ========================================
           GLOBAL & MOBILE-FIRST RESET
        ========================================
        */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            height: 100dvh; /* Dynamic viewport height crucial for mobile browsers */
            width: 100vw;
            overflow: hidden; /* Prevent body scroll, everything contained */
            font-family: var(--font-main);
            background: var(--bg-dark);
            color: #ffffff;
            position: relative;
        }

        /* Prevent text-overflow by aggressive word breaking globally */
        p, span, h1, h2, h3, div {
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .ambient-glow {
            position: absolute; width: 50vw; height: 50vw; top: -10%; left: -10%;
            background: radial-gradient(circle, rgba(76,29,149,0.15) 0%, rgba(0,0,0,0) 70%);
            z-index: 0; pointer-events: none;
        }
        .ambient-glow-2 {
            position: absolute; width: 60vw; height: 60vw; bottom: -10%; right: -10%;
            background: radial-gradient(circle, rgba(37,99,235,0.15) 0%, rgba(0,0,0,0) 70%);
            z-index: 0; pointer-events: none;
        }

        /* 
        ========================================
           SHARED COMPONENTS
        ========================================
        */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .premium-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }
        .premium-input:focus {
            border-color: rgba(99, 102, 241, 0.8);
            background: rgba(0, 0, 0, 0.4);
        }

        .premium-btn {
            background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
            color: white; font-weight: 600; font-size: 16px;
            padding: 16px; border-radius: 16px; cursor: pointer;
            width: 100%; border: none; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .premium-btn:active { transform: scale(0.98); }

        /* Screen Controller */
        .app-screen {
            display: none;
            position: absolute; inset: 0; width: 100%; height: 100dvh;
            flex-direction: column;
            z-index: 5;
        }
        .app-screen.active { display: flex; }

        /* 
        ========================================
           AUTH SCREENS (MOBILE FIRST)
        ========================================
        */
        .auth-container {
            width: 90%; max-width: 400px; margin: auto;
            padding: 40px 24px; text-align: center; z-index: 10;
        }
        .id-box {
            background: rgba(0,0,0,0.4); border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 12px; padding: 12px; font-family: monospace; font-size: 14px;
            color: #a5b4fc; display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; margin-top: 8px;
        }

        /* 
        ========================================
           VIDEO CALL SCREEN (MOBILE FIRST)
        ========================================
        */
        #screen-call {
            background: var(--bg-dark);
            position: relative;
            justify-content: flex-end; /* Everything pushed to bottom initially */
        }

        /* Background Video */
        .video-wrapper {
            position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1;
            /* Container centers on desktop */
            display: flex; align-items: center; justify-content: center;
            background: #000;
        }
        #remote-video {
            width: 100%; height: 100%; object-fit: cover; /* Mobile: Fullscreen stretch/cover */
        }
        
        .video-overlay {
            position: absolute; inset: 0; z-index: 2; pointer-events: none;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 30%, rgba(0,0,0,0) 100%);
        }

        /* Local PIP */
        .pip-video {
            position: absolute; top: 20px; right: 20px; 
            width: 90px; height: 135px; background: #000;
            border-radius: 16px; overflow: hidden; z-index: 20;
            border: 2px solid rgba(255,255,255,0.2); box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transform: scaleX(-1);
        }
        .pip-video video { width: 100%; height: 100%; object-fit: cover; }

        .call-header {
            position: absolute; top: 20px; left: 20px; z-index: 20;
            display: flex; align-items: center; gap: 10px;
            background: rgba(0,0,0,0.4); padding: 8px 16px; border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        .status-dot { width: 8px; height: 8px; background-color: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; }

        /* UI Overlays (Chat + Controls) Stacked Securely */
        .ui-layer {
            position: absolute; inset: 0; z-index: 10;
            display: flex; flex-direction: column;
            pointer-events: none; /* Let video clicks pass */
        }

        .chat-scroll-area {
            flex: 1; /* Takes ALL remaining space above controls */
            overflow-y: auto; pointer-events: auto;
            padding: 20px 15px; 
            display: flex; flex-direction: column; gap: 12px;
            /* Scroll snap or flex end doesn't natively work nicely together across all mobile,
               we handle auto-scrolling via JS */
            padding-top: 150px; /* Space for PIP */
        }
        
        /* Hide scrollbar for clean look */
        .chat-scroll-area::-webkit-scrollbar { display: none; }

        /* Chat Bubbles */
        .chat-bubble {
            background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1); padding: 12px 16px;
            border-radius: 20px; border-bottom-left-radius: 4px;
            color: #fff; max-width: 85%; /* Mobile max width */
            align-self: flex-start;
            pointer-events: auto; /* Allow interaction / copying */
            /* Prevent overflow inside bubble */
            display: flex; flex-direction: column;
        }
        .chat-bubble.mine {
            background: rgba(99, 102, 241, 0.4); border: 1px solid rgba(99, 102, 241, 0.2);
            border-bottom-left-radius: 20px; border-bottom-right-radius: 4px;
            align-self: flex-end;
        }

        .msg-original { font-weight: 600; font-size: 15px; line-height: 1.4; }
        .msg-translated { font-size: 13px; color: rgba(255,255,255,0.7); margin-top: 4px; line-height: 1.3;}
        .msg-tag { font-size: 9px; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-top: 6px; letter-spacing: 1px;}

        /* Bottom Fixed Container for Input & Controls */
        .bottom-ui-area {
            flex-shrink: 0; pointer-events: auto;
            display: flex; flex-direction: column; gap: 12px;
            padding: 10px 15px;
            padding-bottom: var(--safe-bottom);
            background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0));
        }

        /* Controls Bar */
        .controls-row {
            display: flex; justify-content: center; gap: 20px;
        }
        .control-btn {
            width: 48px; height: 48px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.15); color: white; font-size: 22px;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(10px); cursor: pointer;
        }
        .control-btn.btn-end { background: rgba(239, 68, 68, 0.8); }

        /* Input Bar */
        .input-row {
            display: flex; background: rgba(20,20,25,0.9);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 24px;
            padding: 6px 12px; align-items: center; gap: 10px;
            backdrop-filter: blur(15px); position: relative;
        }
        .input-row input {
            flex: 1; min-width: 0; /* Prevents flex blowout */
            background: transparent; border: none; color: #fff; font-size: 15px; outline: none;
            font-family: var(--font-main); padding: 8px 0;
        }
        .btn-icon-small {
            background: transparent; border: none; color: rgba(255,255,255,0.7); font-size: 24px;
            display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
        }
        .btn-send {
            background: #6366f1; color: #fff; border: none; font-size: 16px;
            width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }

        /* Emoji Picker strictly above input */
        .emoji-picker {
            position: absolute; bottom: calc(100% + 10px); left: 0; right: 0;
            background: rgba(20,20,25,0.98); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
            padding: 12px; display: none; flex-wrap: wrap; gap: 10px; justify-content: center;
            max-height: 200px; overflow-y: auto; pointer-events: auto;
        }
        .emoji-picker.show { display: flex; }
        .emoji-item { font-size: 26px; cursor: pointer; padding: 4px; }

        /* 
        ========================================
           DESKTOP/TABLET RULES (min-width: 1024px)
        ========================================
        */
        @media (min-width: 1024px) {
            .app-screen {
                align-items: center; /* Center content on desktop */
                justify-content: center;
            }
            .auth-container { max-width: 450px; }
            
            /* Video wrapper constraint for Desktop to avoid stretching */
            .video-wrapper {
                max-width: 1200px; margin: 0 auto;
                border-left: 1px solid rgba(255,255,255,0.05);
                border-right: 1px solid rgba(255,255,255,0.05);
                box-shadow: 0 0 50px rgba(0,0,0,0.5);
                position: relative; overflow: hidden;
            }
            #remote-video { object-fit: contain; background: #000;}

            /* Desktop UI constraints */
            .ui-layer {
                max-width: 1200px; margin: 0 auto; left: 0; right: 0;
            }

            .chat-bubble { max-width: 70%; }
            .pip-video { width: 140px; height: 210px; bottom: 150px; top: auto; right: 40px;}
            
            /* Give Chat a fixed width side area feeling on desktop, or keep bottom? Keeping bottom for consistency with mobile but bounded width */
            .chat-scroll-area { 
                align-items: flex-start; /* Messages left/right aligned inside container */
                padding: 40px;
                padding-bottom: 20px;
            }
            .bottom-ui-area {
                padding: 20px 40px; background: none;
            }
        }
    </style>
</head>

<body>

    <div class="ambient-glow"></div>
    <div class="ambient-glow-2"></div>

    <!-- INITIAL SCREEN -->
    <div id="screen-initial" class="app-screen active">
        <div class="auth-container glass-panel">
            <h1 class="text-3xl font-extrabold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-blue-500 pb-1">
                Connect Instantly
            </h1>
            <p class="text-sm text-gray-400 mb-8">Premium unfiltered video chat.</p>

            <div class="mb-6 text-left w-full">
                <label class="text-xs uppercase tracking-wider text-gray-400 font-semibold block ml-1">Your Unique ID</label>
                <div class="id-box" onclick="copyMyID()">
                    <span id="my-id-display">Generating...</span>
                    <ion-icon name="copy-outline"></ion-icon>
                </div>
            </div>

            <div class="mb-8 w-full">
                <input type="text" id="nickname-input" class="premium-input" placeholder="Enter your nickname">
            </div>

            <button onclick="goToConnectScreen()" class="premium-btn">
                <span>Continue</span>
                <ion-icon name="arrow-forward-outline"></ion-icon>
            </button>
        </div>
    </div>

    <!-- CONNECT SCREEN -->
    <div id="screen-connect" class="app-screen">
        <div class="auth-container glass-panel relative">
            <button onclick="goToInitialScreen()" class="absolute top-6 left-6 text-gray-400 text-sm flex items-center gap-1">
                <ion-icon name="chevron-back-outline"></ion-icon> Back
            </button>
            
            <h2 class="text-2xl font-bold mb-2 mt-8">Join a Room</h2>
            <p class="text-sm text-gray-400 mb-8">Enter your friend's ID below.</p>

            <div class="mb-8 w-full">
                <input type="text" id="target-id" class="premium-input text-center font-mono placeholder:font-sans" placeholder="Friend's ID">
            </div>

            <button onclick="startConnection()" class="premium-btn">
                <ion-icon name="videocam-outline"></ion-icon>
                <span>Connect Now</span>
            </button>
        </div>
    </div>

    <!-- VIDEO CALL SCREEN -->
    <div id="screen-call" class="app-screen">
        
        <!-- Video Layer Behind Everything -->
        <div class="video-wrapper">
            <video id="remote-video" autoplay playsinline></video>
            <div class="video-overlay"></div>
            
            <!-- PIP lives inside the wrapper for correct bounding -->
            <div class="pip-video glass-panel p-0 border-0">
                <video id="local-video" autoplay muted playsinline></video>
            </div>
            
            <div class="call-header glass-panel">
                <div class="status-dot animate-pulse"></div>
                <div class="flex flex-col ml-2">
                    <span id="remote-nickname" class="text-sm font-bold text-white">Stranger</span>
                    <span class="text-[10px] uppercase tracking-widest text-gray-400">Connected</span>
                </div>
            </div>
        </div>

        <!-- UI Flex Layer (Scrollable chat + fixed bottom controls) -->
        <div class="ui-layer">
            <div id="chat-messages" class="chat-scroll-area">
                <!-- Messages will stack here -->
            </div>
            
            <div class="bottom-ui-area">
                <!-- Controls Row -->
                <div class="controls-row">
                    <button class="control-btn" id="btn-mic" onclick="toggleMic()">
                        <ion-icon name="mic-outline"></ion-icon>
                    </button>
                    <button class="control-btn btn-end" onclick="endCall()">
                        <ion-icon name="call"></ion-icon>
                    </button>
                    <button class="control-btn" id="btn-cam" onclick="toggleCam()">
                        <ion-icon name="videocam-outline"></ion-icon>
                    </button>
                </div>

                <!-- Input Row -->
                <div class="input-row z-30">
                    <div id="emoji-picker" class="emoji-picker"></div>
                    
                    <button class="btn-icon-small" onclick="toggleEmojiPicker()">
                        <ion-icon name="happy-outline"></ion-icon>
                    </button>
                    
                    <input type="text" id="chat-input" placeholder="Say something nice..." onkeypress="handleEnter(event)">
                    
                    <button class="btn-send" onclick="sendMsg()">
                        <ion-icon name="send"></ion-icon>
                    </button>
                </div>
            </div>
        </div>

    </div>


    <script>
        const peer = new Peer();
        let conn;
        let localStream;
        let myNickname = "Anonymous";
        let isMicOn = true;
        let isCamOn = true;
        
        const emojis = ["😀","😂","😍","😘","😎","🤩","🤔","😢","😭","😡","😱","😴","👍","❤️","🔥","✨","🚀","👀","🎉","🙌"];

        // Setup Emojis
        const picker = document.getElementById('emoji-picker');
        emojis.forEach(e => {
            const span = document.createElement('span');
            span.className = 'emoji-item';
            span.innerText = e;
            span.onclick = () => {
                const input = document.getElementById('chat-input');
                input.value += e;
                input.focus();
                toggleEmojiPicker();
            };
            picker.appendChild(span);
        });

        // UI Routing
        function showScreen(id) {
            document.querySelectorAll('.app-screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function goToConnectScreen() {
            const nick = document.getElementById('nickname-input').value.trim();
            if(nick) myNickname = nick;
            showScreen('screen-connect');
        }

        function goToInitialScreen() {
            showScreen('screen-initial');
        }

        function toggleEmojiPicker() {
            picker.classList.toggle('show');
        }

        // Init media
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                localStream = stream;
                document.getElementById('local-video').srcObject = stream;
            })
            .catch(err => {
                console.error("Camera/Mic access denied", err);
                alert("Please allow camera permissions for video chat.");
            });

        // PeerJS Routing
        peer.on('open', id => document.getElementById('my-id-display').innerText = id);

        peer.on('connection', c => { 
            conn = c; setupConn(); showScreen('screen-call');
            conn.on('open', () => conn.send({ type: 'sys', nickname: myNickname }));
        });

        peer.on('call', call => { 
            call.answer(localStream); 
            call.on('stream', s => document.getElementById('remote-video').srcObject = s); 
            showScreen('screen-call');
        });

        function startConnection() {
            const id = document.getElementById('target-id').value.trim();
            if(!id) return;
            conn = peer.connect(id);
            setupConn();
            conn.on('open', () => conn.send({ type: 'sys', nickname: myNickname }));
            peer.call(id, localStream).on('stream', s => document.getElementById('remote-video').srcObject = s);
            showScreen('screen-call');
        }

        function setupConn() {
            conn.on('data', data => {
                if(data.type === 'sys' && data.nickname) document.getElementById('remote-nickname').innerText = data.nickname;
                else if(data.text) addMessage(data.text, data.trans, false);
            });
            conn.on('close', endCall);
        }

        function endCall() {
            if(conn) conn.close();
            document.getElementById('remote-video').srcObject = null;
            document.getElementById('chat-messages').innerHTML = "";
            showScreen('screen-initial');
        }

        function toggleMic() {
            if(!localStream) return;
            isMicOn = !isMicOn;
            localStream.getAudioTracks()[0].enabled = isMicOn;
            const btn = document.getElementById('btn-mic');
            btn.innerHTML = isMicOn ? '<ion-icon name="mic-outline"></ion-icon>' : '<ion-icon name="mic-off-outline"></ion-icon>';
            btn.style.background = isMicOn ? 'rgba(255,255,255,0.15)' : 'rgba(239, 68, 68, 0.8)';
        }

        function toggleCam() {
            if(!localStream) return;
            isCamOn = !isCamOn;
            localStream.getVideoTracks()[0].enabled = isCamOn;
            const btn = document.getElementById('btn-cam');
            btn.innerHTML = isCamOn ? '<ion-icon name="videocam-outline"></ion-icon>' : '<ion-icon name="videocam-off-outline"></ion-icon>';
            btn.style.background = isCamOn ? 'rgba(255,255,255,0.15)' : 'rgba(239, 68, 68, 0.8)';
        }

        function handleEnter(e) { if(e.key === 'Enter') sendMsg(); }

        async function sendMsg() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text) return;
            
            input.value = '';
            picker.classList.remove('show');

            let transText = text;
            try {
                // Free limited API call to show translation capability
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=pt|en`);
                const json = await res.json();
                if(json.responseData && json.responseData.translatedText) {
                    transText = json.responseData.translatedText;
                }
            } catch(e) { console.warn("Translation ignored", e); }

            if(conn && conn.open) conn.send({ text: text, trans: transText });
            addMessage(text, transText, true);
        }

        function addMessage(orig, trans, isMine) {
            const container = document.getElementById('chat-messages');
            const shell = document.createElement('div');
            shell.className = `chat-bubble ${isMine ? 'mine' : ''} w-full`;
            
            // To ensure word-wrap acts strongly we wrap text in explicit containers
            shell.innerHTML = `
                <div class="msg-original break-words overflow-hidden">${orig}</div>
                ${orig !== trans ? `
                    <div class="msg-translated break-words overflow-hidden">${trans}</div>
                    <div class="msg-tag">Translated</div>
                ` : `<div class="msg-tag">Original</div>`}
            `;
            
            container.appendChild(shell);
            container.scrollTop = container.scrollHeight;
        }

        function copyMyID() {
            const id = document.getElementById('my-id-display').innerText;
            if(id !== 'Generating...') {
                navigator.clipboard.writeText(id).then(() => alert("ID copied!"));
            }
        }
    </script>
</body>
</html>
