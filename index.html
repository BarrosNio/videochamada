<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Premium Video Connect (Socket.io)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <!-- Socket.io MUST be served from our node server -->
    <script src="/socket.io/socket.io.js"></script>

    <style>
        :root {
            --bg-dark: #07070a;
            --font-main: 'Outfit', sans-serif;
            --safe-bottom: env(safe-area-inset-bottom, 15px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            height: 100dvh; width: 100vw; overflow: hidden;
            font-family: var(--font-main); background: var(--bg-dark); color: #ffffff;
            position: relative;
        }

        p, span, h1, h2, h3, div {
            word-wrap: break-word; overflow-wrap: break-word; word-break: break-word;
        }

        .ambient-glow {
            position: absolute; width: 50vw; height: 50vw; top: -10%; left: -10%;
            background: radial-gradient(circle, rgba(76,29,149,0.15) 0%, rgba(0,0,0,0) 70%);
            z-index: 0; pointer-events: none;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .premium-input {
            width: 100%; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff; padding: 16px 20px; border-radius: 16px; font-size: 16px; outline: none;
        }
        .premium-input:focus { border-color: rgba(99, 102, 241, 0.8); background: rgba(0, 0, 0, 0.4); }

        .premium-btn {
            background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
            color: white; font-weight: 600; padding: 16px; border-radius: 16px; 
            width: 100%; border: none; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;
        }

        .app-screen {
            display: none; position: absolute; inset: 0; width: 100%; height: 100dvh;
            flex-direction: column; z-index: 5;
        }
        .app-screen.active { display: flex; }

        .auth-container {
            width: 90%; max-width: 400px; margin: auto;
            padding: 40px 24px; text-align: center; z-index: 10;
        }

        .id-box {
            background: rgba(0,0,0,0.4); border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 12px; padding: 12px; font-family: monospace; font-size: 14px;
            color: #a5b4fc; display: flex; justify-content: space-between; cursor: pointer; margin-top: 8px;
        }

        /* Video Area */
        #screen-call { background: var(--bg-dark); position: relative; justify-content: flex-end; }

        .video-wrapper {
            position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1;
            display: flex; align-items: center; justify-content: center; background: #000;
        }
        #remote-video {
            width: 100%; height: 100%; object-fit: cover;
        }
        
        /* VERY IMPORTANT: Dark gradient overlay ensuring white text on chat always pops */
        .video-overlay {
            position: absolute; inset: 0; z-index: 2; pointer-events: none;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 40%, transparent 100%);
        }

        .pip-video {
            position: absolute; top: 20px; right: 20px; 
            width: 90px; height: 135px; background: #000;
            border-radius: 16px; overflow: hidden; z-index: 20;
            border: 2px solid rgba(255,255,255,0.2);
            transform: scaleX(-1);
        }
        .pip-video video { width: 100%; height: 100%; object-fit: cover; }

        .call-header {
            position: absolute; top: 20px; left: 20px; z-index: 20;
            display: flex; align-items: center; gap: 10px;
            background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 20px;
        }

        /* 
           UI Overlay layer for Chat 
           Must be significantly high z-index to overlay video properly 
        */
        .ui-layer {
            position: absolute; inset: 0; z-index: 9999; 
            display: flex; flex-direction: column;
            pointer-events: none;
        }

        .chat-scroll-area {
            flex: 1; overflow-y: auto; pointer-events: auto;
            padding: 20px 15px; padding-top: 150px; 
            display: flex; flex-direction: column; gap: 12px;
        }
        .chat-scroll-area::-webkit-scrollbar { display: none; }

        /* Bubbles ensure text is readable */
        .chat-bubble {
            background: rgba(20,20,25,0.7); backdrop-filter: blur(12px); 
            border: 1px solid rgba(255,255,255,0.1); padding: 12px 16px;
            border-radius: 20px; border-bottom-left-radius: 4px;
            color: #fff; max-width: 85%; align-self: flex-start; pointer-events: auto;
        }
        .chat-bubble.mine {
            background: rgba(99, 102, 241, 0.4); border: 1px solid rgba(99, 102, 241, 0.3);
            border-bottom-left-radius: 20px; border-bottom-right-radius: 4px;
            align-self: flex-end;
        }

        .msg-original { font-weight: 600; font-size: 15px; line-height: 1.4; color: #fff;}
        .msg-translated { font-size: 13px; color: rgba(255,255,255,0.8); margin-top: 4px; line-height: 1.3;}
        .msg-tag { font-size: 9px; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-top: 6px; letter-spacing: 1px;}

        .bottom-ui-area {
            flex-shrink: 0; pointer-events: auto;
            display: flex; flex-direction: column; gap: 12px;
            padding: 10px 15px; padding-bottom: var(--safe-bottom);
        }

        .controls-row { display: flex; justify-content: center; gap: 20px; }
        .control-btn {
            width: 48px; height: 48px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.15); color: white; font-size: 22px;
            display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px);
        }
        .control-btn.btn-end { background: rgba(239, 68, 68, 0.8); }

        .input-row {
            display: flex; background: rgba(20,20,25,0.9);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 24px;
            padding: 6px 12px; align-items: center; gap: 10px; position: relative;
        }
        .input-row input { flex: 1; min-width: 0; background: transparent; border: none; color: #fff; outline: none; }
        
        .translate-select {
            background: transparent; color: #fff; width: 60px; outline: none; border: none; font-size: 12px; font-weight: bold;
        }
        .translate-select option { background: #101018; color: #fff;}

        .btn-icon-small { background: transparent; color: rgba(255,255,255,0.7); font-size: 24px; border: none; }
        .btn-send { background: #6366f1; color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; }

        .emoji-picker {
            position: absolute; bottom: calc(100% + 10px); left: 0; right: 0;
            background: rgba(20,20,25,0.98); border-radius: 20px;
            padding: 12px; display: none; flex-wrap: wrap; gap: 10px; justify-content: center; max-height: 200px; overflow-y: auto;
        }
        .emoji-picker.show { display: flex; }
        .emoji-item { font-size: 26px; cursor: pointer; padding: 4px; }

        @media (min-width: 1024px) {
            .app-screen { align-items: center; justify-content: center; }
            .auth-container { max-width: 450px; }
            .video-wrapper { max-width: 1200px; margin: 0 auto; border-left: 1px solid rgba(255,255,255,0.05); border-right: 1px solid rgba(255,255,255,0.05); }
            #remote-video { object-fit: contain; }
            .ui-layer { max-width: 1200px; margin: 0 auto; left: 0; right: 0; }
            .chat-bubble { max-width: 70%; }
            .pip-video { width: 140px; height: 210px; bottom: 150px; top: auto; right: 40px;}
            .chat-scroll-area { padding: 40px; padding-bottom: 20px; }
        }
    </style>
</head>

<body>

    <div class="ambient-glow"></div>

    <!-- INITIAL SCREEN -->
    <div id="screen-initial" class="app-screen active">
        <div class="auth-container glass-panel">
            <h1 class="text-3xl font-extrabold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-blue-500 pb-1">
                Connect Instantly
            </h1>
            <p class="text-sm text-gray-400 mb-8">Raw WebRTC & Socket.io Backend.</p>

            <div class="mb-6 text-left w-full">
                <label class="text-xs uppercase tracking-wider text-gray-400 font-semibold block ml-1">Your Unique Room ID</label>
                <div class="id-box" onclick="copyMyID()">
                    <span id="my-id-display">Generating...</span>
                    <ion-icon name="copy-outline"></ion-icon>
                </div>
            </div>

            <div class="mb-8 w-full">
                <input type="text" id="nickname-input" class="premium-input" placeholder="Enter your nickname">
            </div>

            <button onclick="goToConnectScreen()" class="premium-btn">
                <span>Continue</span>
                <ion-icon name="arrow-forward-outline"></ion-icon>
            </button>
        </div>
    </div>

    <!-- CONNECT SCREEN -->
    <div id="screen-connect" class="app-screen">
        <div class="auth-container glass-panel relative">
            <button onclick="goToInitialScreen()" class="absolute top-6 left-6 text-gray-400 text-sm flex items-center gap-1">
                <ion-icon name="chevron-back-outline"></ion-icon> Back
            </button>
            <h2 class="text-2xl font-bold mb-2 mt-8">Join a Room</h2>
            <p class="text-sm text-gray-400 mb-8">Enter friend's ID or join your own generated ID.</p>

            <div class="mb-8 w-full">
                <input type="text" id="target-id" class="premium-input text-center font-mono placeholder:font-sans" placeholder="Friend's Room ID">
            </div>

            <button onclick="joinRoom()" class="premium-btn">
                <ion-icon name="videocam-outline"></ion-icon>
                <span>Connect Now</span>
            </button>
        </div>
    </div>

    <!-- VIDEO CALL SCREEN -->
    <div id="screen-call" class="app-screen">
        <div class="video-wrapper">
            <!-- Must have autoplay and playsinline to prevent black screens -->
            <video id="remote-video" autoplay playsinline></video>
            <div class="video-overlay"></div>
            
            <div class="pip-video glass-panel p-0 border-0">
                <!-- Muted locally to prevent echo feedback -->
                <video id="local-video" autoplay muted playsinline></video>
            </div>
            
            <div class="call-header glass-panel">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                <div class="flex flex-col ml-2">
                    <span id="remote-nickname" class="text-sm font-bold text-white">Waiting for someone...</span>
                    <span class="text-[10px] uppercase tracking-widest text-gray-400">Status</span>
                </div>
            </div>
        </div>

        <div class="ui-layer">
            <div id="chat-messages" class="chat-scroll-area"></div>
            
            <div class="bottom-ui-area">
                <div class="controls-row">
                    <button class="control-btn" id="btn-mic" onclick="toggleMic()">
                        <ion-icon name="mic-outline"></ion-icon>
                    </button>
                    <button class="control-btn btn-end" onclick="leaveRoom()">
                        <ion-icon name="call"></ion-icon>
                    </button>
                    <button class="control-btn" id="btn-cam" onclick="toggleCam()">
                        <ion-icon name="videocam-outline"></ion-icon>
                    </button>
                </div>

                <div class="input-row z-30">
                    <div id="emoji-picker" class="emoji-picker"></div>
                    <button class="btn-icon-small" onclick="toggleEmojiPicker()"><ion-icon name="happy-outline"></ion-icon></button>
                    
                    <select id="lang-select" class="translate-select" title="Auto Translate To">
                        <option value="en">EN</option>
                        <option value="pt">PT-BR</option>
                        <option value="es">ES</option>
                        <option value="uk">UK</option>
                        <option value="ru">RU</option>
                        <option value="zh">ZH</option>
                    </select>

                    <input type="text" id="chat-input" placeholder="Say something..." onkeypress="handleEnter(event)">
                    <button class="btn-send" onclick="sendMsg()"><ion-icon name="send"></ion-icon></button>
                </div>
            </div>
        </div>
    </div>


    <script>
        // Use Socket.io to connect to local/hosted backend
        // Note: For this to work, node server.js must be running!
        const socket = typeof io !== 'undefined' ? io() : null;
        
        let localStream;
        let peerConnection;
        let currentRoom = "";
        let myNickname = "Anonymous";
        let generatedId = Math.random().toString(36).substr(2, 6).toUpperCase();
        
        const config = {
            iceServers: [
                { urls: "stun:stun.l.google.com:19302" },
                { urls: "stun:stun1.l.google.com:19302"}
            ]
        };

        const emojis = ["😀","😂","😍","😘","😎","🤩","🤔","😢","😭","😡","😱","😴","👍","❤️","🔥","✨","🚀","👀"];
        const picker = document.getElementById('emoji-picker');
        emojis.forEach(e => {
            const span = document.createElement('span');
            span.className = 'emoji-item'; span.innerText = e;
            span.onclick = () => { document.getElementById('chat-input').value += e; toggleEmojiPicker(); };
            picker.appendChild(span);
        });

        document.getElementById('my-id-display').innerText = generatedId;
        
        // Wait for device permissions right away
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                localStream = stream;
                document.getElementById('local-video').srcObject = stream;
            })
            .catch(err => {
                console.error("Critical: Camera access denied or absent.", err);
                alert("Camera and Mic access are required for this app to work.");
            });

        function showScreen(id) {
            document.querySelectorAll('.app-screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
        function goToConnectScreen() { 
            const nick = document.getElementById('nickname-input').value.trim();
            if(nick) myNickname = nick;
            showScreen('screen-connect'); 
        }
        function goToInitialScreen() { showScreen('screen-initial'); }
        function toggleEmojiPicker() { picker.classList.toggle('show'); }
        function copyMyID() { navigator.clipboard.writeText(generatedId).then(()=>alert("Room ID Copied!")); }

        // ============================================
        // WEBRTC + SOCKET.IO SIGNALING LOGIC
        // ============================================
        
        function joinRoom() {
            if(!socket) {
                alert("Socket.io is not connected! Ensure 'node server.js' is running.");
                return;
            }
            const targetId = document.getElementById('target-id').value.trim();
            currentRoom = targetId || generatedId;
            socket.emit('join-room', currentRoom, myNickname);
            showScreen('screen-call');
        }

        if(socket) {
            // When someone joins, the person already inside creates an Offer
            socket.on('user-joined', async (userId, nickname) => {
                document.getElementById('remote-nickname').innerText = nickname;
                initPeerConnection();
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('offer', currentRoom, offer);
            });

            socket.on('offer', async (userId, offer) => {
                // The joining person receives the offer and creates an Answer
                initPeerConnection();
                await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                socket.emit('answer', currentRoom, answer);
            });

            socket.on('answer', async (userId, answer) => {
                // The original person receives the answer
                await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
            });

            socket.on('ice-candidate', async (userId, candidate) => {
                // Exchange internet pathways
                if (peerConnection) {
                    try { await peerConnection.addIceCandidate(new RTCIceCandidate(candidate)); }
                    catch (e) { console.error("Error adding received ice candidate", e); }
                }
            });

            socket.on('chat-history', (historyArr) => {
                historyArr.forEach(msg => addMessageUI(msg.orig, msg.trans, msg.nickname));
            });
            
            socket.on('sys-msg', (nick) => document.getElementById('remote-nickname').innerText = nick);
            
            socket.on('chat-message', (data) => {
                addMessageUI(data.orig, data.trans, data.nickname);
            });
        }

        function initPeerConnection() {
            if(peerConnection) peerConnection.close();
            peerConnection = new RTCPeerConnection(config);

            // Add local stream tracks to connection
            if(localStream) {
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });
            }

            // Receive remote stream
            peerConnection.ontrack = (event) => {
                const remoteVideo = document.getElementById('remote-video');
                // Ensure stream is properly attached to fix black screens
                if (remoteVideo.srcObject !== event.streams[0]) {
                    remoteVideo.srcObject = event.streams[0];
                    console.log("Remote video stream successfully attached.");
                    socket.emit('sys-msg', currentRoom, myNickname); // Let them know my name 
                }
            };

            peerConnection.onicecandidate = (event) => {
                if(event.candidate) {
                    socket.emit('ice-candidate', currentRoom, event.candidate);
                }
            };
        }

        function leaveRoom() {
            if(peerConnection) peerConnection.close();
            document.getElementById('remote-video').srcObject = null;
            document.getElementById('chat-messages').innerHTML = "";
            document.getElementById('remote-nickname').innerText = "Waiting for someone...";
            currentRoom = "";
            showScreen('screen-initial');
        }

        // ============================================
        // CHAT & TRANSLATION SYSTEM
        // ============================================

        function handleEnter(e) { if(e.key === 'Enter') sendMsg(); }

        async function sendMsg() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text || !socket) return;
            
            input.value = '';
            picker.classList.remove('show');
            const targetLang = document.getElementById('lang-select').value;
            
            let transText = text;
            try {
                // Dynamic Translation API (MyMemory translates between detected implicitly and target)
                // Sending to targetLang! E.g. Text is Portuguese, translation is English
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=Autodetect|${targetLang}`);
                const json = await res.json();
                if(json.responseData && json.responseData.translatedText) {
                    transText = json.responseData.translatedText;
                }
            } catch(e) { console.warn("Dynamic translation failed:", e); }

            const msgData = { orig: text, trans: transText, nickname: myNickname };
            
            socket.emit('chat-message', currentRoom, msgData);
            addMessageUI(text, transText, myNickname);
        }

        function addMessageUI(orig, trans, nickname) {
            const container = document.getElementById('chat-messages');
            const isMine = nickname === myNickname;
            const shell = document.createElement('div');
            // Z-index handled by parent .ui-layer holding z-index 9999
            shell.className = `chat-bubble ${isMine ? 'mine' : ''} w-full`;
            
            shell.innerHTML = `
                <div class="text-[9px] uppercase tracking-widest opacity-50 mb-1">${isMine ? 'You' : nickname}</div>
                <div class="msg-original break-words overflow-hidden">${orig}</div>
                ${orig !== trans ? `
                    <div class="msg-translated break-words overflow-hidden">${trans}</div>
                    <div class="msg-tag">Translated</div>
                ` : `<div class="msg-tag">Original Text</div>`}
            `;
            
            container.appendChild(shell);
            container.scrollTop = container.scrollHeight;
        }

        // ============================================
        // MEDIA TOGGLES
        // ============================================
        let isMicOn = true, isCamOn = true;
        function toggleMic() {
            if(!localStream) return;
            isMicOn = !isMicOn;
            localStream.getAudioTracks()[0].enabled = isMicOn;
            const btn = document.getElementById('btn-mic');
            btn.innerHTML = isMicOn ? '<ion-icon name="mic-outline"></ion-icon>' : '<ion-icon name="mic-off-outline"></ion-icon>';
            btn.style.background = isMicOn ? 'rgba(255,255,255,0.15)' : 'rgba(239, 68, 68, 0.8)';
        }

        function toggleCam() {
            if(!localStream) return;
            isCamOn = !isCamOn;
            localStream.getVideoTracks()[0].enabled = isCamOn;
            const btn = document.getElementById('btn-cam');
            btn.innerHTML = isCamOn ? '<ion-icon name="videocam-outline"></ion-icon>' : '<ion-icon name="videocam-off-outline"></ion-icon>';
            btn.style.background = isCamOn ? 'rgba(255,255,255,0.15)' : 'rgba(239, 68, 68, 0.8)';
        }
    </script>
</body>
</html>
