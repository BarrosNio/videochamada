<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Chat</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f0f0f;
  color: white;
}

#login, #call {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
}

#call {
  display: none;
}

/* INPUTS */
input, button {
  margin: 5px;
  padding: 10px;
  border-radius: 8px;
  border: none;
}

button {
  background: purple;
  color: white;
}

/* VIDEO */
#remoteVideo {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#localVideo {
  position: absolute;
  bottom: 80px;
  right: 10px;
  width: 120px;
  border-radius: 10px;
}

/* CHAT */
#chat {
  position: absolute;
  bottom: 0;
  width: 100%;
  background: rgba(0,0,0,0.6);
  padding: 10px;
}

#messages {
  max-height: 120px;
  overflow-y: auto;
}

.msg {
  margin-bottom: 5px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <h2>Seu ID:</h2>
  <p id="myId"></p>

  <input id="nickname" placeholder="Seu nome">
  <input id="room" placeholder="ID do amigo">

  <button onclick="start()">Ativar câmera</button>
  <button onclick="connect()">Conectar</button>
</div>

<!-- CALL -->
<div id="call">
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay muted playsinline></video>

  <div id="chat">
    <div id="messages"></div>
    <input id="msg" placeholder="Mensagem">
    <button onclick="send()">Enviar</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io(window.location.origin);

let localStream;
let peer;
let roomId;
let nickname = "";

// 🔥 GERAR ID AUTOMÁTICO
const myId = Math.random().toString(36).substring(2, 8);
document.getElementById("myId").innerText = myId;

// 🔥 CAMERA
async function start() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

    document.getElementById("localVideo").srcObject = localStream;
    alert("Câmera ativada");

  } catch (e) {
    alert("Erro na câmera: " + e.message);
  }
}

// 🔥 CONECTAR
function connect() {
  roomId = document.getElementById("room").value;
  nickname = document.getElementById("nickname").value;

  if (!roomId) return alert("Digite o ID do amigo");
  if (!nickname) return alert("Digite seu nome");
  if (!localStream) return alert("Ative a câmera primeiro");

  socket.emit("join-room", roomId, nickname);

  document.getElementById("login").style.display = "none";
  document.getElementById("call").style.display = "flex";

  createPeer();
}

// 🔥 WEBRTC
function createPeer() {
  peer = new RTCPeerConnection();

  localStream.getTracks().forEach(track => {
    peer.addTrack(track, localStream);
  });

  peer.ontrack = e => {
    document.getElementById("remoteVideo").srcObject = e.streams[0];
  };

  peer.onicecandidate = e => {
    if (e.candidate) {
      socket.emit("ice-candidate", e.candidate);
    }
  };

  socket.on("offer", async offer => {
    await peer.setRemoteDescription(offer);
    const answer = await peer.createAnswer();
    await peer.setLocalDescription(answer);
    socket.emit("answer", answer);
  });

  socket.on("answer", async answer => {
    await peer.setRemoteDescription(answer);
  });

  socket.on("ice-candidate", candidate => {
    peer.addIceCandidate(candidate);
  });

  createOffer();
}

async function createOffer() {
  const offer = await peer.createOffer();
  await peer.setLocalDescription(offer);
  socket.emit("offer", offer);
}

// 🔥 CHAT
function send() {
  const msg = document.getElementById("msg").value;

  if (!msg) return;

  const data = {
    name: nickname,
    msg: msg,
    translated: "[EN] " + msg
  };

  socket.emit("chat-message", data);
  addMessage(data);
  document.getElementById("msg").value = "";
}

socket.on("chat-message", data => {
  addMessage(data);
});

function addMessage(data) {
  const div = document.createElement("div");
  div.classList.add("msg");

  div.innerHTML = `
    <b>${data.name}:</b> ${data.msg}<br>
    <small>${data.translated}</small>
  `;

  document.getElementById("messages").appendChild(div);
}
</script>

</body>
</html>
